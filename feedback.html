<!DOCTYPE html>
<html>
    <head>
        <title>Feedback Form</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body class="adb-stock">
        <main class="adb-main">
            <h1>Feedback Form</h1>
            <form class="feed-form">
                <input class="input-alice-blue" id="feed-email" type="email" placeholder="Enter email here" required>
                <input type="text" placeholder="subject">
                <input class="input-alice-blue" id="feed-body" type="text" placeholder="What's on your mind?" required>
                <br>
                <button class="submit-btn" type="submit">Submit</button>
            </form>
        </main>
    </body>
</html>
