<!DOCTYPE html>
<html>
    <head>
        <title>Feedback Form</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body class="adb-stock">
        <main class="adb-main">
            <h1>Feedback Form</h1>
            <form class="feed-form">
                <input class="input-alice-blue" id="feed-email" type="email" placeholder="Enter email here..." required>
                <div class="feed-btn-trio">
                    <label><input class="feed-btn-trio-child" type="radio" name="subject" value="feedback"><span class="feed-rad-text-inner">Feedback</span></label>
                    <label><input class="feed-btn-trio-child" type="radio" name="subject" value="issue"><span class="feed-rad-text-inner">Issue</span></label>
                    <label><input class="feed-btn-trio-child" type="radio" name="subject" value="other"><span class="feed-rad-text-inner">Other</span></label>
                </div>
                <textarea class="input-alice-blue" id="feed-body" type="text" placeholder="What's on your mind? (max: 4000 characters)" minlength="30" maxlength="4000" required></textarea>
                <br>
                <button class="submit-btn" type="submit">Submit</button>
            </form>
        </main>
        <script src="feedback.js"></script>
    </body>
</html>
