<!DOCTYPE html>
<html>
    <head>
        <title>Adobe Stock Automator</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body class="adb-stock">
        <main class="adb-main">
            <div class="welcome-rand-text"><h1>Welcome</h1></div>
            <div class="input">
                <form class="api-quest-form">
                    <input class="input-alice-blue" type="text" id="api-text-box" placeholder="Enter api key here...">
                    <button id="save-api" type="submit" class="save-btn">Save</button>
                </form>

                <form class="num-keywords">
                    <input class="input-alice-blue" type="text" id="num-keywords-text-box" placeholder="Enter # of keywords...">
                    <button id="save-num" type="submit" class="save-btn">Save</button>
                </form>
            </div>

            <form class="ai-only-query"><label>Check Gen AI tools?<input class="check-ai-only" type="checkbox"></label></form>
            <form class="releases-query"><label>Check no releases?<input class="releases-check" type="checkbox"></label></form>

            <div class="line-border-sepa"></div>
            <p class="text-upg-prem"></p>

            <div class="footer-sub-feed">
                <form class="my-btn-hold"><button type="submit" class="sub-btn-blue">Subscription</button></form>
                <form class="my-btn-hold"><button type="submit" class="feed-btn-orange">Feedback</button></form>
            </div>
        </main>
        <script src="background.js"></script>
    </body>
</html>
