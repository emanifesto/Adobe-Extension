<!DOCTYPE html>
<html>
    <head>
        <title>Adobe Stock Automator</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="welcome"><h1>Welcome</h1></div>
            <div class="input">
                <form class="api">
                    <input type="text" class="api-text-box"placeholder="Enter api key here...">
                    <button type="submit" class="save-btn">Save</button>
                </form>

                <form class="num-keywords">
                    <input type="text" class="num-keywords-text-box" placeholder="Enter # of keywords...">
                    <button type="submit" class="save-btn">Save</button>
                </form>
            </div>

            <form class="ai"><label>Generative AI only?<input class="check" type="checkbox"></label></form>

            <div class="line"></div>

            <p class="text">Upgrade to premium for full automation.</p>

            <form class="automate"><button class="hands-free" type="submit"><div class="play"></div></button></form>

            <button class="the-btn" type="submit"><img class="icon" src="icon2.png" alt="the extension icon"></button>

            <form class="footer">
                <button type="submit" class="sub-btn">Subscription</button>
                <button type="submit" class="feed-btn">Feedback</button>
            </form>

        </main>
    </body>
</html>
