<!DOCTYPE html>
<html>
    <head>
        <title>Adobe Stock Automator</title>
        <link href="styles.css" rel="stylesheet">
    </head>
    <body>
        <main>
            <div class="welcome"><h1>Welcome!</h1></div>
            <div class="input">
                <div class="api">
                    <div class="api-text-box">Enter api key here...</div>
                    <div class="save-btn">Save</div>
                </div>
                <div class="num-keywords">
                    <div class="num-keywords-text-box">Enter # of keywords...</div>
                    <div class="save-btn">Save</div>
                </div>
            </div>
            <div class="hands-free"><p class="text">Upgrade to premium for full automation.</p></div>
            <div class="footer">
                <div class="subscription">Subscription</div>
                <div class="feedback">Feedback</div>
            </div>
        </main>
    </body>
</html>
